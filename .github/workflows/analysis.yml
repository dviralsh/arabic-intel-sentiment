name: Run Analysis Pipeline

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * *"   # daily 04:00 UTC — collect + analyze + deploy
  workflow_dispatch:
    inputs:
      mode:
        description: "Pipeline mode"
        required: true
        default: "incremental"
        type: choice
        options: [incremental, full, collect, analyze, report]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore cached model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ hashFiles('requirements.txt') }}
          restore-keys: hf-models-

      # ── Step 1: Collect real data (RSS + Web always; Twitter/Telegram if keys present)
      - name: Collect data
        env:
          TWITTER_BEARER_TOKEN:        ${{ secrets.TWITTER_BEARER_TOKEN }}
          TWITTER_API_KEY:             ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET:          ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN:        ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
          TELEGRAM_API_ID:             ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH:           ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_PHONE:              ${{ secrets.TELEGRAM_PHONE }}
        run: python main.py --mode collect

      # ── Step 2: Analyze + generate dashboard JSON
      - name: Analyze and generate report
        run: python main.py --mode report

      # ── Step 3: Commit updated data back to the repo
      - name: Commit updated data and report
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ dashboard/data/ || true
          git diff --cached --quiet && echo "No changes to commit" || \
            git commit -m "data: pipeline run $(date -u +%Y-%m-%dT%H:%M)Z [skip ci]"
          git push

      # ── Step 4: Deploy dashboard to GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dashboard

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Dashboard URL
        run: echo "Dashboard live at ${{ steps.deployment.outputs.page_url }}"
