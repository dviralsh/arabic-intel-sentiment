################################################################################
# ANALYSIS PARAMETERS
################################################################################
analysis:
  sentiment_model: "UBC-NLP/MARBERTv2"
  fallback_model: "aubmindlab/bert-base-arabertv02"
  batch_size: 32
  max_sequence_length: 512
  languages: ["ar", "fa"]  # Arabic, Farsi
  min_text_length: 10
  collection_window_days: 90  # rolling 90-day window
  baseline_period:
    start: "2024-01-01"
    end: "2024-12-31"
  comparison_period:
    start: "2025-01-01"
    end: "2026-05-14"  # today

  # Intelligence themes to track
  themes:
    - id: "military_morale"
      label: "Military Morale"
      keywords_ar: ["شهيد", "استشهد", "نصر", "هزيمة", "انتصار", "معنويات", "صمود", "مقاومة"]
      keywords_en: ["martyr", "victory", "defeat", "resistance", "steadfast"]
    - id: "civilian_support"
      label: "Civilian Support"
      keywords_ar: ["الشعب", "مواطنون", "جماهير", "دعم", "تضامن", "احتجاج", "معارضة"]
      keywords_en: ["people", "civilian", "support", "protest", "opposition"]
    - id: "economic_hardship"
      label: "Economic Pressure"
      keywords_ar: ["اقتصاد", "فقر", "غلاء", "عقوبات", "حصار", "تضخم", "بطالة"]
      keywords_en: ["economy", "sanctions", "inflation", "poverty", "blockade"]
    - id: "military_operations"
      label: "Military Operations"
      keywords_ar: ["عملية", "هجوم", "قصف", "صاروخ", "طائرة مسيّرة", "دفاع", "ميليشيا"]
      keywords_en: ["operation", "attack", "missile", "drone", "airstrike", "defense"]
    - id: "leadership_trust"
      label: "Leadership Trust"
      keywords_ar: ["قيادة", "ثقة", "قرار", "فساد", "خيانة", "إخلاص", "بيعة"]
      keywords_en: ["leadership", "trust", "decision", "corruption", "loyalty"]
    - id: "international_relations"
      label: "International Relations"
      keywords_ar: ["إيران", "روسيا", "الصين", "أمريكا", "إسرائيل", "تحالف", "دبلوماسية"]
      keywords_en: ["iran", "russia", "china", "america", "israel", "alliance"]
