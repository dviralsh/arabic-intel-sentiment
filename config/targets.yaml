################################################################################
# ANALYSIS PARAMETERS
################################################################################
analysis:
  sentiment_model_primary: "CAMeL-Lab/bert-base-arabic-camelbert-mix-sentiment"
  sentiment_model_fallback: "UBC-NLP/MARBERTv2"
  sentiment_model_fallback2: "aubmindlab/bert-base-arabertv02"
  batch_size: 64
  max_sequence_length: 512
  languages: ["ar", "fa"]
  min_text_length: 10
  collection_window_days: 540  # 18 months for solid baseline
  target_samples_per_group: 10000
  target_samples_per_source_type: 2000

  baseline_period:
    start: "2024-01-01"
    end: "2024-12-31"
  comparison_period:
    start: "2025-01-01"
    end: "2026-05-14"

  # Source divergence thresholds
  # When official vs civilian sentiment diverges by this much, flag it
  source_divergence_alert_threshold: 0.25

  themes:
    - id: "military_morale"
      label: "Military Morale"
      keywords_ar: ["شهيد", "استشهد", "نصر", "هزيمة", "انتصار", "معنويات", "صمود", "مقاومة", "رباط", "بطولة", "كمين", "خسائر", "قتلى"]
      keywords_en: ["martyr", "victory", "defeat", "resistance", "steadfast", "losses", "casualties"]
    - id: "civilian_support"
      label: "Civilian Support"
      keywords_ar: ["الشعب", "مواطنون", "جماهير", "دعم", "تضامن", "احتجاج", "معارضة", "الرأي العام", "استطلاع", "ثقة", "شعبية"]
      keywords_en: ["people", "civilian", "support", "protest", "opposition", "public opinion", "trust"]
    - id: "economic_hardship"
      label: "Economic Pressure"
      keywords_ar: ["اقتصاد", "فقر", "غلاء", "عقوبات", "حصار", "تضخم", "بطالة", "ارتفاع الأسعار", "الليرة", "الريال", "الدولار", "أزمة"]
      keywords_en: ["economy", "sanctions", "inflation", "poverty", "blockade", "unemployment", "crisis"]
    - id: "military_operations"
      label: "Military Operations"
      keywords_ar: ["عملية عسكرية", "هجوم", "قصف", "صاروخ", "طائرة مسيّرة", "دفاع جوي", "كمين", "تفجير", "اشتباك", "معركة"]
      keywords_en: ["operation", "attack", "missile", "drone", "airstrike", "ambush", "battle", "strike"]
    - id: "leadership_trust"
      label: "Leadership Trust"
      keywords_ar: ["قيادة", "ثقة", "قرار", "فساد", "خيانة", "إخلاص", "بيعة", "انتقاد", "محاسبة", "الأمين العام"]
      keywords_en: ["leadership", "trust", "decision", "corruption", "loyalty", "accountability", "criticism"]
    - id: "international_relations"
      label: "International Relations"
      keywords_ar: ["إيران", "روسيا", "الصين", "أمريكا", "إسرائيل", "تحالف", "دبلوماسية", "اتفاقية", "معاهدة", "محادثات"]
      keywords_en: ["iran", "russia", "china", "america", "israel", "alliance", "diplomacy", "agreement"]
    - id: "propaganda_intensity"
      label: "Propaganda Intensity"
      keywords_ar: ["الإعلام", "رواية", "حرب المعلومات", "تضليل", "دعاية", "إشاعة", "تأطير", "خطاب"]
      keywords_en: ["media", "narrative", "information war", "disinformation", "propaganda", "framing"]
    - id: "humanitarian"
      label: "Humanitarian Conditions"
      keywords_ar: ["مجاعة", "نزوح", "لاجئون", "جرحى", "مستشفى", "دواء", "غذاء", "ماء", "مساعدات", "كارثة إنسانية"]
      keywords_en: ["famine", "displacement", "refugees", "injured", "hospital", "medicine", "food", "aid"]
