################################################################################
# TARGET SOURCES — ARABIC INTELLIGENCE COLLECTION
# 100+ sources across 5 source types per group
#
# SOURCE TYPES (intel value explanation):
#   official_media    — state/party-controlled broadcast outlets
#                       → pure propaganda signal; watch for narrative shifts
#   official_telegram — group's own Telegram channels
#                       → fastest primary messaging; less filtered
#   affiliated_telegram — sympathizer/amplifier channels
#                       → organic spread, grassroots tone
#   civilian_telegram — civilian commentary discussing these groups
#                       → real public sentiment; highest intel value
#   twitter_official  — verified/official Twitter accounts
#   twitter_affiliated — supporter accounts and journalists
#   rss_feed          — RSS/Atom from aligned news agencies
#   web_official      — official websites (HTML scraping)
################################################################################

source_types:
  official_media:
    label: "Official Media"
    color: "#ef4444"
    description: "State or party-controlled broadcast outlets — pure propaganda signal"
  official_telegram:
    label: "Official Telegram"
    color: "#f97316"
    description: "Group's own Telegram channels — primary messaging, less filtered"
  affiliated_telegram:
    label: "Affiliated Telegram"
    color: "#eab308"
    description: "Sympathizer/amplifier channels — organic spread and grassroots tone"
  civilian_telegram:
    label: "Civilian Telegram"
    color: "#22c55e"
    description: "Civilian commentary on these groups — highest raw intelligence value"
  twitter_official:
    label: "Official Twitter"
    color: "#818cf8"
    description: "Official verified accounts — curated public statements"
  twitter_affiliated:
    label: "Affiliated Twitter"
    color: "#a78bfa"
    description: "Supporter journalists and activists — amplification layer"
  rss_feed:
    label: "RSS / News"
    color: "#06b6d4"
    description: "Aligned news agencies via RSS — volume content"
  web_official:
    label: "Official Websites"
    color: "#64748b"
    description: "Official party/org websites — authoritative statements"

