name: Run Analysis Pipeline

on:
  schedule:
    - cron: "0 4 * * *"   # daily 04:00 UTC — collect new posts
    - cron: "0 6 * * *"   # daily 06:00 UTC — analyze + report
  workflow_dispatch:
    inputs:
      mode:
        description: "Pipeline mode"
        required: true
        default: "incremental"
        type: choice
        options: [incremental, full, collect, analyze, report]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ── Job 1: incremental data collection ─────────────────────────────────────
  collect:
    if: github.event.schedule == '0 4 * * *' || github.event.inputs.mode == 'collect' || github.event.inputs.mode == 'incremental' || github.event.inputs.mode == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore cached model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ hashFiles('requirements.txt') }}
          restore-keys: hf-models-

      - name: Collect — incremental (new posts only via watermarks)
        env:
          TWITTER_BEARER_TOKEN:        ${{ secrets.TWITTER_BEARER_TOKEN }}
          TWITTER_API_KEY:             ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET:          ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN:        ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
          TELEGRAM_API_ID:             ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH:           ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_PHONE:              ${{ secrets.TELEGRAM_PHONE }}
        run: python main.py --mode collect

      - name: Commit state and cache partitions
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/state/ data/cache/ || true
          git diff --cached --quiet && echo "No new data" || \
            git commit -m "data: incremental collection $(date -u +%Y-%m-%dT%H:%M)Z [skip ci]"
          git push

  # ── Job 2: analyze + report + deploy ───────────────────────────────────────
  analyze-and-deploy:
    if: always()
    needs: [collect]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ hashFiles('requirements.txt') }}
          restore-keys: hf-models-

      - name: Run analysis + report
        env:
          MODE: ${{ github.event.inputs.mode || 'incremental' }}
          GOOGLE_TRANSLATE_API_KEY: ${{ secrets.GOOGLE_TRANSLATE_API_KEY }}
        run: python main.py --mode report

      - name: Commit updated dashboard report
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/data/ data/state/ || true
          git diff --cached --quiet && echo "No changes" || \
            git commit -m "report: update intelligence report $(date -u +%Y-%m-%dT%H:%M)Z [skip ci]"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dashboard

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Print dashboard URL
        run: echo "Dashboard live at ${{ steps.deployment.outputs.page_url }}"
